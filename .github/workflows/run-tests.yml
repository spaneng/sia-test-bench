name: Run Tests

on:
  workflow_call:

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: spaneng/doover_device_base

    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git libpango-1.0-0 libharfbuzz0b \
          libpangoft2-1.0-0 \
          libcairo2 \
          libgdk-pixbuf2.0-0 \
          libglib2.0-0 \
          shared-mime-info 

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev

      - name: Run tests
        # This might use `doover app test` in the future.
        run: uv run pytest tests
