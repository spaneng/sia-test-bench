[project]
name = "sia-test-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover==1.0.0a7",
    "transitions>=0.9.2",
    "aiohttp>=3.11.18",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "textual>=8.2.3",
]

[project.scripts]
doover-app-run = "sia_test_bench:main"
export-config = "sia_test_bench.app_config:export"
export-ui = "sia_test_bench.app_config:export_ui"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
